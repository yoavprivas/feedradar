name: Check cloud identity claims
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  claims:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const token = await core.getIDToken();
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            for (const key of ['repository','repository_id','repository_owner_id','ref','sub','environment']) core.info(key + ': ' + claims[key]);
