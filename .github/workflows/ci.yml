name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: feedradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d feedradar_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/feedradar_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Build and verify container persistence
        run: |
          printf 'DOCKER_DB_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env.docker
          docker compose --env-file .env.docker up --build -d --wait
          node scripts/docker-smoke.mjs
      - name: Stop isolated CI containers
        if: always()
        run: docker compose --env-file .env.docker down
